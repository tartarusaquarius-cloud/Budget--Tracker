<!DOCTYPE html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ترکر مالی</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#eceaf8"><link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eceaf8;--hi:#fff;--lo:#c8c9e3;--tx:#3d4160;--mu:#8b90ab;--ac:#a9a6ee;
--sr:6px 6px 14px var(--lo),-6px -6px 14px var(--hi);--si:inset 3px 3px 7px var(--lo),inset -3px -3px 7px var(--hi);--sb:4px 4px 9px var(--lo),-4px -4px 9px var(--hi);--rad:20px}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#3b3e48;--hi:#4a4e5b;--lo:#2b2d35;--tx:#eceef4;--mu:#a9adbb;--ac:#b9b6f2}}
:root[data-theme=dark]{--bg:#3b3e48;--hi:#4a4e5b;--lo:#2b2d35;--tx:#eceef4;--mu:#a9adbb;--ac:#b9b6f2}
:root[data-style=clay]{--sr:9px 11px 24px var(--lo),-6px -6px 16px var(--hi),inset -6px -6px 12px #0000000f,inset 6px 6px 12px #ffffff55;--si:inset 4px 4px 9px #00000018,inset -3px -3px 7px var(--hi);--sb:5px 6px 13px var(--lo),-3px -3px 8px var(--hi),inset -3px -3px 7px #0000001a,inset 3px 3px 7px #ffffff55;--rad:30px}
:root[data-style=glass]{--sr:0 10px 30px #00000022,inset 0 1px 0 #ffffffaa;--si:inset 0 2px 5px #00000018;--sb:0 4px 14px #00000020,inset 0 1px 0 #ffffffbb;--rad:26px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Vazirmatn,Tahoma,sans-serif;font-size:14px}
.raise{background:var(--bg);box-shadow:var(--sr);border-radius:var(--rad)}
.inset{background:var(--bg);box-shadow:var(--si);border-radius:12px}
.wrap{max-width:1500px;margin:auto;padding:18px 22px 30px}
.top{display:grid;grid-template-columns:1.1fr .9fr 1.6fr 1fr;gap:18px;margin-bottom:18px}
.main{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;align-items:start}
.col{display:flex;flex-direction:column;gap:18px}
.card{padding:16px}
h3{display:inline-block;background:#d9d8f7;color:#2e3150;padding:4px 14px;border-radius:20px;font-size:12px;margin:0 0 10px;font-weight:700}
.hr{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
h1{margin:0;font-size:21px;font-weight:800;background:linear-gradient(90deg,#a9a6ee,#8fc1f5,#eba7c9);-webkit-background-clip:text;background-clip:text;color:transparent;direction:ltr}
.row{display:flex;gap:6px;margin-bottom:10px}.row button{flex:1;padding:6px 4px;font-size:12px}.th button{padding:5px 9px}
button{font:inherit;color:var(--tx);border:0;cursor:pointer;background:var(--bg);border-radius:12px;padding:7px 12px;box-shadow:var(--sb)}
button:active,button.on{box-shadow:var(--si)}button.on{color:var(--ac);font-weight:800}
.fld{width:100%;min-width:0;border:0;outline:0;background:var(--bg);color:var(--tx);font:inherit;font-size:12px;padding:5px 7px;border-radius:10px;box-shadow:var(--si)}
.fld.n{text-align:center}
select.fld{appearance:none;-webkit-appearance:none;padding:5px 2px;text-align:center;text-align-last:center;cursor:pointer}
.f{display:flex;flex-direction:column;gap:3px;margin-bottom:8px;font-size:12px;color:var(--mu)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.nav{display:flex;align-items:center;gap:8px;margin-bottom:10px}.nav span{flex:1;text-align:center;font-weight:800}
table{width:100%;border-collapse:separate;border-spacing:0 4px}
th{font-size:11px;color:var(--mu);font-weight:600;padding:2px}
td{padding:0 2px}
.tb td:nth-child(4) .fld{background:color-mix(in srgb,var(--c) 18%,var(--bg))}
.tot td{font-size:12px;font-weight:800;text-align:center;padding:5px 2px;border-radius:10px}
.tot td:first-child{text-align:right}
.ok,.fld.ok{background:#bfe8c9!important;color:#1f5a33!important}
.bad,.fld.bad{background:#f3b9b9!important;color:#7a2222!important}
.add{width:100%;margin-top:6px;font-size:12px;color:var(--mu)}
.st td{text-align:center;font-size:12px;padding:6px 3px;border-radius:10px}.st td:first-child{text-align:right;font-weight:600}
.ring{--p:0;--c:var(--ac);--s:150px;width:var(--s);height:var(--s);border-radius:50%;flex:none;display:grid;place-items:center;background:conic-gradient(var(--c) calc(var(--p)*1%),transparent 0);box-shadow:var(--si);position:relative}
.ring:before{content:"";position:absolute;inset:calc(var(--s)/9);border-radius:50%;background:var(--bg);box-shadow:var(--sb)}
.ring b{position:relative;text-align:center;line-height:1.5}
.mid{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;min-height:160px}
.cb{display:grid;grid-template-columns:62px 1fr 84px;align-items:center;gap:8px;margin-bottom:9px;font-size:12px}
.cb .inset{height:14px;overflow:hidden}.cb i{display:block;height:100%;border-radius:10px;transition:width .4s}.cb b{font-size:11px;text-align:left;direction:ltr}
.lg{font-size:11px;color:var(--mu);display:flex;flex-direction:column;gap:4px}.lg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-inline-end:5px}
.igw{display:flex;justify-content:center;padding:18px 16px 0}
.ig{display:inline-flex;align-items:center;gap:9px;padding:8px 20px;border-radius:999px;text-decoration:none;color:var(--tx);font-weight:600;direction:ltr;background:var(--bg);box-shadow:var(--sb)}
.tabs{display:none}
:root[data-style=glass] body{background:radial-gradient(circle at 12% 15%,#8fc1f5cc,transparent 42%),radial-gradient(circle at 88% 25%,#eba7c9cc,transparent 42%),radial-gradient(circle at 50% 95%,#9fe0b8cc,transparent 48%),radial-gradient(circle at 80% 80%,#ffd88acc,transparent 40%),var(--bg);background-attachment:fixed;min-height:100vh}
:root[data-style=glass] .raise,:root[data-style=glass] .tabs{background:color-mix(in srgb,var(--bg) 38%,transparent);-webkit-backdrop-filter:blur(20px) saturate(170%);backdrop-filter:blur(20px) saturate(170%);border:1px solid #ffffff66}
:root[data-style=glass] .inset,:root[data-style=glass] .fld,:root[data-style=glass] button,:root[data-style=glass] .ig{background:#ffffff33;border:1px solid #ffffff66}
:root[data-style=glass] button.on{background:color-mix(in srgb,var(--ac) 40%,#ffffff30)}
:root[data-style=glass] .ring:before{background:color-mix(in srgb,var(--bg) 55%,transparent)}
@media(max-width:1250px){.top{grid-template-columns:1fr 1fr}.main{grid-template-columns:1fr 1fr}}
@media(max-width:900px){
.wrap{padding:12px 12px 96px}.top,.main{display:block}.top>.card,.col,.main>.card{margin-bottom:16px}.col{display:block}.col>.card{margin-bottom:16px}
[data-sec]:not(.aw){display:none!important}
.fld{font-size:14px;padding:8px}
.tabs{display:flex;position:fixed;bottom:0;inset-inline:0;gap:5px;overflow-x:auto;padding:10px 8px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);box-shadow:0 -6px 16px var(--lo);z-index:9}
.tabs button{flex:1 0 auto;padding:9px 10px;font-size:12px;white-space:nowrap}.tabs button.on{background:var(--c);color:#2e3150}
}
</style></head><body>
<div class="igw"><a class="ig" href="https://www.instagram.com/Malih_talk" target="_blank" rel="noopener"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="url(#igg)" stroke-width="2"><defs><linearGradient id="igg" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#ffc27a"/><stop offset=".5" stop-color="#eba7c9"/><stop offset="1" stop-color="#8f8fe0"/></linearGradient></defs><rect x="3" y="3" width="18" height="18" rx="5.5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.3" cy="6.7" r="1.1" fill="url(#igg)" stroke="none"/></svg><span>Malih_talk</span></a></div>
<div class="wrap" id="app"></div><div class="tabs" id="tabs"></div>
<script>
const MN=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const fa=n=>String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]),pc=(a,b)=>b?Math.round(a/b*100):0,$=id=>document.getElementById(id),esc=s=>String(s).replace(/"/g,'&quot;');
const en=s=>String(s).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
const num=s=>+en(s).replace(/[^\d.]/g,'')||0,money=n=>fa(Math.round(n).toLocaleString('en-US')),fmt=n=>n?money(n):'';
const dim=m=>m<6?31:m<11?30:29,p2=n=>String(n).padStart(2,'0');
const SECS=[['inc','درآمد','#c9b8f0',1],['bil','قبوض','#eba7c9',2],['exp','هزینه‌ها','#ffc27a',3],['sav','پس‌انداز','#8ed3f7',4]],HI={inc:1,sav:1,bil:0,exp:0},TABS=['خلاصه','درآمد','قبوض','هزینه‌ها','پس‌انداز'],TC=['#a9a6ee','#c9b8f0','#eba7c9','#ffc27a','#8ed3f7'];
let TH='auto',ST='neo';try{TH=localStorage.getItem('theme')||'auto';ST=localStorage.getItem('style')||'neo'}catch(e){}
const applyTh=()=>{const r=document.documentElement;r.setAttribute('data-style',ST);TH==='auto'?r.removeAttribute('data-theme'):r.setAttribute('data-theme',TH)};applyTh();
const pf=new Intl.DateTimeFormat('fa-IR-u-ca-persian-nu-latn',{year:'numeric',month:'numeric'}).formatToParts(new Date()).reduce((o,p)=>(o[p.type]=+p.value||p.value,o),{});
let Y=pf.year,M=pf.month-1,AW=0,S={};try{S=JSON.parse(localStorage.getItem('budget')||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem('budget',JSON.stringify(S))}catch(e){}};
const mk=()=>({c:'',d:'',b:0,a:0}),rows=()=>Array.from({length:10},mk),key=()=>Y+'-'+M;
const W=()=>S[key()]||(S[key()]={a:Y+'/'+p2(M+1)+'/01',b:Y+'/'+p2(M+1)+'/'+p2(dim(M)),r:{inc:rows(),bil:rows(),exp:rows(),sav:rows()},t:[50,30,20]});
function render(){const w=W(),DAYS=Array.from({length:dim(M)},(_,i)=>i+1);
const tbl=([k,n,c,i])=>`<div class="card raise" data-sec="${i}" style="--c:${c}"><h3 style="background:${c}">${n}</h3><table class="tb"><thead><tr><th style="width:32%">دسته‌بندی</th><th style="width:25%">تاریخ</th><th>بودجه</th><th>واقعی</th></tr></thead><tbody>${w.r[k].map((x,r)=>`<tr><td><input class="fld" data-k="${k}" data-r="${r}" data-f="c" value="${esc(x.c)}"></td><td><select class="fld n" data-k="${k}" data-r="${r}" data-f="d"><option value=""></option>${DAYS.map(d=>`<option value="${d}" ${String(x.d)==String(d)?'selected':''}>${fa(p2(M+1))}/${fa(p2(d))}</option>`).join('')}</select></td><td><input class="fld n" inputmode="numeric" data-k="${k}" data-r="${r}" data-f="b" value="${fmt(x.b)}"></td><td><input class="fld n" inputmode="numeric" id="a-${k}-${r}" data-k="${k}" data-r="${r}" data-f="a" value="${fmt(x.a)}"></td></tr>`).join('')}<tr class="tot"><td colspan="2" style="background:${c}55">کل</td><td id="tb-${k}"></td><td id="ta-${k}"></td></tr></tbody></table><button class="add" data-add="${k}">+ ردیف جدید</button></div>`;
const S3=[['bil','قبوض'],['exp','هزینه‌ها'],['sav','پس‌انداز']];
$('app').innerHTML=`<div class="top">
<div class="card raise" data-sec="0"><div class="hr"><h1>Budget Tracker</h1><div class="row th" style="margin:0">${[['light','☀️'],['dark','🌙'],['auto','🖥️']].map(([k,i])=>`<button data-th="${k}" class="${TH==k?'on':''}">${i}</button>`).join('')}</div></div>
<div class="row">${[['neo','نئومورفیسم'],['clay','خمیری'],['glass','شیشه‌ای']].map(([k,l])=>`<button data-st="${k}" class="${ST==k?'on':''}">${l}</button>`).join('')}</div>
<div class="nav"><button data-m="-1">›</button><span>${MN[M]} ${fa(Y)}</span><button data-m="1">‹</button></div>
<div class="f2"><label class="f">سال<input class="fld" type="number" data-y value="${Y}"></label><label class="f">ماه<select class="fld" data-sel="m">${MN.map((n,i)=>`<option value="${i}" ${i==M?'selected':''}>${n}</option>`).join('')}</select></label></div>
<div class="f2"><label class="f">تاریخ شروع<input class="fld n" data-pa value="${esc(fa(w.a))}"></label><label class="f">تاریخ اتمام<input class="fld n" data-pb value="${esc(fa(w.b))}"></label></div></div>
<div class="card raise" data-sec="0"><h3>باقی‌مانده برای خرج</h3><div class="mid"><div class="ring" id="rr"><b id="rt" style="font-size:14px"></b></div></div></div>
<div class="card raise" data-sec="0"><h3>جریان نقدی کلی</h3><div id="cf"></div></div>
<div class="card raise" data-sec="0"><h3>تفکیک هزینه‌ها</h3><div class="mid"><div class="ring" id="dn" style="--s:130px"></div><div class="lg" id="lg"></div></div></div></div>
<div class="main"><div class="col">${tbl(SECS[0])}
<div class="card raise" data-sec="0"><h3 style="background:#c9d9f0">خلاصه هزینه‌ها</h3><table class="st"><thead><tr><th></th><th>هدف</th><th>بودجه</th><th>واقعی</th></tr></thead><tbody>${S3.map(([k,n])=>`<tr><td>${n}</td><td id="st-${k}"></td><td id="sb-${k}"></td><td id="sa-${k}"></td></tr>`).join('')}<tr><td>مانده</td><td></td><td id="sb-r"></td><td id="sa-r"></td></tr></tbody></table></div>
<div class="card raise" data-sec="0"><h3 style="background:#d9c9f0">٪ مقدار هزینه‌ها</h3><table class="st"><thead><tr><th></th><th>هدف</th><th>بودجه</th><th>واقعی</th></tr></thead><tbody>${S3.map(([k,n],i)=>`<tr><td>${i==2?'پس‌انداز + مانده':n}</td><td><input class="fld n" inputmode="numeric" data-t="${i}" value="${fa(w.t[i])}"></td><td id="pb-${i}"></td><td id="pa-${i}"></td></tr>`).join('')}</tbody></table></div></div>
${tbl(SECS[1])}${tbl(SECS[2])}${tbl(SECS[3])}</div>`;
$('tabs').innerHTML=TABS.map((n,i)=>`<button data-tab="${i}" style="--c:${TC[i]}">${n}</button>`).join('');setAW();upd()}
function setAW(){document.querySelectorAll('[data-sec]').forEach(e=>e.classList.toggle('aw',+e.dataset.sec===AW));document.querySelectorAll('[data-tab]').forEach(e=>e.classList.toggle('on',+e.dataset.tab===AW))}
const txt=(id,v)=>{const e=$(id);if(e)e.textContent=v},cls=(id,g,on=1)=>{const e=$(id);if(e){e.classList.toggle('ok',!!on&&g);e.classList.toggle('bad',!!on&&!g)}};
function upd(){const w=W(),T={};
SECS.forEach(([k])=>{let b=0,a=0;w.r[k].forEach((x,r)=>{b+=x.b;a+=x.a;const g=HI[k]?x.a>=x.b:x.a<=x.b;cls('a-'+k+'-'+r,g,x.b||x.a)});T[k]={b,a};txt('tb-'+k,money(b));txt('ta-'+k,money(a)+' تومان');cls('ta-'+k,HI[k]?a>=b:a<=b,b||a)});
const RB=T.inc.b-T.bil.b-T.exp.b-T.sav.b,RA=T.inc.a-T.bil.a-T.exp.a-T.sav.a;
[['bil',0],['exp',1],['sav',2]].forEach(([k,i])=>{txt('st-'+k,money(w.t[i]/100*T.inc.b));txt('sb-'+k,money(T[k].b));txt('sa-'+k,money(T[k].a));cls('sa-'+k,HI[k]?T[k].a>=T[k].b:T[k].a<=T[k].b,T[k].b||T[k].a)});
txt('sb-r',money(RB));txt('sa-r',money(RA));cls('sa-r',RA>=RB,T.inc.b||T.inc.a);
const bp=[T.bil.b,T.exp.b,T.sav.b+RB],ap=[T.bil.a,T.exp.a,T.sav.a+RA];
bp.forEach((v,i)=>{const b=pc(v,T.inc.b),a=pc(ap[i],T.inc.a);txt('pb-'+i,fa(b)+'٪');txt('pa-'+i,fa(a)+'٪');cls('pa-'+i,i==2?a>=b:a<=b,T.inc.a||T.inc.b)});
const rr=$('rr');rr.style.setProperty('--p',pc(Math.max(RA,0),T.inc.a));rr.style.setProperty('--c',RA<0?'#f3a0a0':'#9fe0b8');txt('rt',money(RA)+'\nتومان');$('rt').style.whiteSpace='pre-line';
const it=[['درآمد',T.inc.a,'#c9b8f0'],['قبوض',T.bil.a,'#eba7c9'],['هزینه‌ها',T.exp.a,'#ffc27a'],['پس‌انداز',T.sav.a,'#8ed3f7'],['مانده',RA,'#9fe0b8']],mx=Math.max(...it.map(x=>Math.abs(x[1])),1);
$('cf').innerHTML=it.map(([n,v,c])=>`<div class="cb"><span>${n}</span><div class="inset"><i style="width:${Math.abs(v)/mx*100}%;background:${c}"></i></div><b>${money(v)}</b></div>`).join('');
const pt=[['قبوض',T.bil.a,'#eba7c9'],['هزینه‌ها',T.exp.a,'#ffc27a'],['پس‌انداز',T.sav.a,'#8ed3f7'],['مانده',Math.max(RA,0),'#9fe0b8']],tot=pt.reduce((s,x)=>s+x[1],0);let c=0;
$('dn').style.background=tot?`conic-gradient(${pt.map(([,v,col])=>{const s=c;c+=v/tot*100;return`${col} ${s}% ${c}%`}).join(',')})`:'transparent';
$('lg').innerHTML=pt.map(([n,v,col])=>`<span><i style="background:${col}"></i>${n} ${fa(pc(v,tot))}٪</span>`).join('')}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
if(d.m){M+=+d.m;if(M>11){M=0;Y++}if(M<0){M=11;Y--}render()}
if(d.th){TH=d.th;try{localStorage.setItem('theme',TH)}catch(e){}applyTh();document.querySelectorAll('[data-th]').forEach(x=>x.classList.toggle('on',x.dataset.th===TH))}
if(d.st){ST=d.st;try{localStorage.setItem('style',ST)}catch(e){}applyTh();document.querySelectorAll('[data-st]').forEach(x=>x.classList.toggle('on',x.dataset.st===ST))}
if(d.add){W().r[d.add].push(mk());save();render()}
if(d.tab!==undefined){AW=+d.tab;setAW()}});
document.addEventListener('input',e=>{const d=e.target.dataset,w=W(),v=e.target.value;
if(d.f)w.r[d.k][d.r][d.f]=(d.f=='b'||d.f=='a')?num(v):v;if(d.t!==undefined)w.t[d.t]=num(v);if(d.pa!==undefined)w.a=v;if(d.pb!==undefined)w.b=v;save();upd()});
document.addEventListener('change',e=>{const d=e.target.dataset;
if(d.f=='b'||d.f=='a')e.target.value=fmt(W().r[d.k][d.r][d.f]);
if(d.sel==='m'){M=+e.target.value;render()}if(d.y!==undefined){Y=+e.target.value||Y;render()}});
render();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
